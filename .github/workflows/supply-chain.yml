name: Supply chain

on:
  pull_request:
  # Weekly full scan of main: pull requests fail only on vulnerabilities they
  # introduce, so this is where an advisory against an already-merged
  # dependency surfaces.
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@b5195bdfa40bcf6953b2086ea78a65e466a3dc48 # v1.2.0
    with:
      # Socket's API has intermittently timed out for this org; OSV and
      # pip-audit stay hard gates.
      socket-advisory: true
    secrets: inherit
