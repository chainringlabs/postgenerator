name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@fa903d78b7780fafef650277cd7da54d8c05dd67 # TEMP: ci fix branch
    with:
      socket-advisory: true
    secrets: inherit

  image:
    needs: supply-chain
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@05de2072e684885be22a0185e3d712d8082a15eb # v1.1.0
